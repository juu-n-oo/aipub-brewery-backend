plugins {
    id 'org.springframework.boot'
    id 'org.asciidoctor.jvm.convert' version '4.0.4'
}

description = 'Dockerizer Backend Server - REST API for Dockerfile management and ImageBuild CR creation'

ext {
    snippetsDir = file('build/generated-snippets')
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Database
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'

    // Kubernetes Client (official)
    implementation "io.kubernetes:client-java:$kubernetesClientVersion"
    implementation "io.kubernetes:client-java-spring-integration:$kubernetesClientVersion"

    // OpenSearch client (build log fallback when Kaniko pod is GC'd)
    implementation "org.opensearch.client:opensearch-java:$opensearchJavaVersion"
    implementation 'org.apache.httpcomponents.client5:httpclient5'  // 버전은 Spring Boot BOM 관리

    // MapStruct
    implementation "org.mapstruct:mapstruct:$mapstructVersion"
    annotationProcessor "org.mapstruct:mapstruct-processor:$mapstructVersion"
    annotationProcessor "org.projectlombok:lombok-mapstruct-binding:$lombokMapstructBindingVersion"

    // Springdoc OpenAPI (Swagger UI)
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:$springdocOpenapiVersion"

    // Spring AI MCP Server
    implementation("org.springframework.ai:spring-ai-starter-mcp-server-webmvc:$springAiMcpVersion") {
        exclude group: 'io.swagger.core.v3', module: 'swagger-annotations'
    }

    // swagger-annotations 버전 통일 (springdoc 호환)
    implementation "io.swagger.core.v3:swagger-annotations-jakarta:$swaggerAnnotationsVersion"

    // Spring Boot Test Slices (Spring Boot 4)
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'

    // Spring Security Test
    testImplementation 'org.springframework.security:spring-security-test'

    // Spring REST Docs
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
}

test {
    outputs.dir snippetsDir
}

asciidoctor {
    inputs.dir snippetsDir
    dependsOn test
    baseDirFollowsSourceFile()
    attributes 'snippets': snippetsDir.toString()
}

bootJar {
    dependsOn asciidoctor
    from("${asciidoctor.outputDir}") {
        into 'static/docs'
    }
}
