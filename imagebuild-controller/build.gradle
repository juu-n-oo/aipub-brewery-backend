plugins {
    id 'org.springframework.boot'
}

description = 'ImageKit ImageBuild Controller - K8s Operator that watches ImageBuild CRs and manages Kaniko Jobs'

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Kubernetes Client (official)
    implementation "io.kubernetes:client-java:$kubernetesClientVersion"
    implementation "io.kubernetes:client-java-spring-integration:$kubernetesClientVersion"
    implementation "io.kubernetes:client-java-extended:$kubernetesClientVersion"
}
