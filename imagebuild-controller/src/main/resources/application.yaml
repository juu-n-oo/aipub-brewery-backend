spring:
  application:
    name: imagekit-controller

imagekit:
  kubernetes:
    verify-ssl: false
    kube-config:
      mode: FILE
      kube-config-path: ${HOME}/.kube/config
  imagebuild:
    kaniko-image: gcr.io/kaniko-project/executor:v1.24.0
    job-ttl-seconds: 3600  # 빌드 Job/Pod 완료 후 GC 까지 시간(초). 이후 로그는 OpenSearch fallback 으로만 조회
