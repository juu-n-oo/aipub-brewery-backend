# 리더 선출(leader election)이 없으므로 반드시 1 을 유지한다. 1 을 초과하면 모든 replica 가
# 동일 CR 을 중복 reconcile 한다(ConfigMap/Job 중복 생성·status patch 경합). 1 초과 시 helm 이
# render 단계에서 실패한다(templates/deployment.yaml). HA 가 필요하면 LeaderElector 도입 후 허용.
replicaCount: 1

image:
  repository: ""  # ## HELM installer ##
  pullPolicy: Always
  tag: ""  # ## HELM installer ##

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations:
  ad.datadoghq.com/imagebuild-controller.logs: '[{"source": "java", "service": "imagebuild-controller"}]'
podLabels: {}

podSecurityContext: {}

securityContext: {}

resources: {}

# autoscaling(HPA) 은 제거됨 — C-2 참조. 컨트롤러는 CPU 로 스케일하는 워크로드가 아니며,
# 리더 선출이 없어 다중 replica 가 위험하므로 HPA 를 의도적으로 두지 않는다.

volumes:
  - name: ca-certs
    secret:
      secretName: custom-ca-certs

volumeMounts:
  - mountPath: /certificates
    name: ca-certs
    readOnly: true

nodeSelector: {}

tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists

envFrom:
  configMapSuffix: envs
  secretSuffix: envs

applicationYaml:
  spring:
    profiles:
      active: prod
  dockerizer:
    kubernetes:
      verifySsl: true
      kubeConfig:
        mode: IN_CLUSTER
    imagebuild:
      kanikoImage: ""  # ## HELM installer ## (e.g. registry.ten1010.io:8443/aipub/kaniko-executor:v1.24.0)
      jobTtlSeconds: 3600  # 빌드 Job/Pod 완료 후 GC 까지 시간(초). 이후 로그는 OpenSearch fallback 으로만 조회
  logging:
    level:
      dockerizer: ""  # ## HELM installer ##
  management:
    server:
      port: &managementPort 8082
    endpoint:
      health:
        probes:
          enabled: true
    endpoints:
      web:
        exposure:
          include: health
    health:
      livenessstate:
        enabled: true
      readinessstate:
        enabled: true

agent:
  datadog: "false"
  javaToolOptions: "-javaagent:/opt/aipub/agents/dd-java-agent.jar"
  ddTraceAgentPort: "8126"
  ddService: "imagebuild-controller"
  ddEnv: "production"
  ddVersion: "1.0.0"
  host: "aipub-backend-datadog.aipub.svc.cluster.local"
  ddProfilingEnabled: "true"
  ddProfilingAllocationEnabled: "true"

service:
  type: ClusterIP
  ports:
    - name: management
      port: *managementPort
      protocol: TCP
      targetPort: *managementPort

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: *managementPort
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 1
  successThreshold: 1
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: *managementPort
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 1
  successThreshold: 1
  failureThreshold: 3

# Install CRD with chart
installCrd: true
