{{- if .Values.installCrd }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: imagebuilds.aipub.ten1010.io
  labels:
    {{- include "imagebuild-controller.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  scope: Namespaced
  names:
    plural: imagebuilds
    singular: imagebuild
    kind: ImageBuild
    shortNames:
      - imgbuild
      - ib
  group: aipub.ten1010.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Target Image
          type: string
          jsonPath: .spec.targetImage
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - metadata
            - spec
          properties:
            metadata:
              type: object
            spec:
              type: object
              required:
                - dockerfileContent
                - targetImage
              properties:
                dockerfileContent:
                  type: string
                  description: Inline Dockerfile content to build
                targetImage:
                  type: string
                  description: "Full target image reference including tag (e.g. registry/project/image:tag)"
                pushSecretRef:
                  type: string
                  description: Name of the Secret containing registry push credentials
                buildContextPvc:
                  type: string
                  description: Name of PersistentVolumeClaim to use as build context (required for COPY/ADD commands)
                buildContextSubPath:
                  type: string
                  description: Sub-path within the PVC to use as build context root (optional, defaults to PVC root)
                buildTimeoutSeconds:
                  type: integer
                  minimum: 1
                  description: "Max build wall-clock time in seconds, applied as the Job's activeDeadlineSeconds. Defaults to the controller setting (3600s) when unset."
                imageLabels:
                  type: object
                  additionalProperties:
                    type: string
                  description: "OCI/provenance labels to bake into the built image config (applied via Kaniko --label key=value)"
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Preparing
                    - Building
                    - Succeeded
                    - Failed
                  default: Pending
                startTime:
                  type: string
                  format: date-time
                completionTime:
                  type: string
                  format: date-time
                message:
                  type: string
                imageDigest:
                  type: string
                  description: Image digest on successful push (e.g. sha256:abc...)
{{- end }}
