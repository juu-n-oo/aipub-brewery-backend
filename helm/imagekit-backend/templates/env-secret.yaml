apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-{{ .Values.envFrom.secretSuffix }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "imagekit-backend.labels" . | nindent 4 }}
stringData:
  SPRING_DATASOURCE_PASSWORD: {{ .Values.applicationYaml.spring.datasource.password | quote }}
  {{- if .Values.applicationYaml.imagekit.opensearch.password }}
  IMAGEKIT_OPENSEARCH_PASSWORD: {{ .Values.applicationYaml.imagekit.opensearch.password | quote }}
  {{- end }}
